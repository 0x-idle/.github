name: Bug report
description: Report a reproducible defect or unexpected behavior.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a duplicate. Do not report security vulnerabilities here; use the repository's Security tab.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest reliable sequence of steps, commands, requests, or inputs that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the behavior you expected instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA you tested.
      placeholder: v1.2.3 or abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only details relevant to reproducing the issue, such as OS, architecture, runtime, deployment mode, or client.
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs or other evidence
      description: Add relevant logs, traces, screenshots, or error output. Redact credentials, tokens, and private data.
    validations:
      required: false
