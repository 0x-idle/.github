name: 🐛 Bug Report
description: Report a defect, unexpected error, or reproducible problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps, cURL commands, or code snippets to reproduce the behavior.
      placeholder: |
        1. Start server with config '...'
        2. Send request to endpoint '...'
        3. See error response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A concise explanation of what should have occurred instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit Hash
      description: Which version or git commit are you running? (e.g., v0.3.0 or git commit sha)
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Deployment
      description: OS distribution, architecture, runtime flags, Docker/bare-metal, client agent.
      placeholder: |
        - OS: Linux x86_64 (Debian 12 / Ubuntu 24.04)
        - Deployment: Docker Compose / Bare Metal
        - Upstream Provider(s): OpenAI / Anthropic / Local
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste any server logs or error backtraces here. Please redact secrets and API keys!
      render: shell
    validations:
      required: false
