name: Feature request
description: Propose a change or new capability.
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the outcome you want. Implementation details are useful when they clarify constraints, but they are not required.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation, workflow, or use case is not handled well today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What behavior or capability would address the problem?
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints or trade-offs
      description: Note compatibility requirements, performance constraints, protocol requirements, or other limits that matter.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant links, examples, screenshots, specifications, or references.
    validations:
      required: false
